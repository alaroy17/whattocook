<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Ограничиваем, откуда можно грузить код и куда ходить. Если чужой скрипт всё же
      окажется на странице, он не сможет отправить токен Google Drive на свой сервер.
      Разрешённые адреса: вход Google и его API. blob: нужен для показа фотографий.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' https://accounts.google.com;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob:;
               font-src 'self' data:;
               connect-src 'self' https://www.googleapis.com https://accounts.google.com;
               frame-src https://accounts.google.com https://content.googleapis.com;
               worker-src 'self';
               object-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
    <title>Что готовим</title>
    <meta name="description" content="Домашний дневник еды: рецепты, история, планировщик и список покупок" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/icon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Что готовим" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1815" media="(prefers-color-scheme: dark)" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
